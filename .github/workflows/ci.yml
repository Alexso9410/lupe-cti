name: CI

on:
  push:
    branches: [main, lupe-cti-v1]
  pull_request:
    branches: [main, lupe-cti-v1]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check lupe/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy lupe/ --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=lupe --cov-report=xml --cov-report=term -q
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-debian:
    name: Test (Debian 12)
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          apt-get update
          apt-get install -y python3.11 python3-pip python3-venv git
      - name: Setup venv and test
        run: |
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install -e ".[dev]"
          pytest --cov=lupe --cov-report=term -q

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Bandit
        run: bandit -r lupe/ -c pyproject.toml --severity-level medium
      - name: pip-audit
        run: pip-audit
