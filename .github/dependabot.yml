version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime-deps:
        patterns:
          - "typer"
          - "rich"
          - "httpx"
          - "pydantic"
          - "pydantic-settings"
          - "platformdirs"
          - "flet"
          - "reportlab"
          - "phonenumbers"
      dev-deps:
        patterns:
          - "pytest"
          - "respx"
          - "ruff"
          - "mypy"
          - "bandit"
          - "pre-commit"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
