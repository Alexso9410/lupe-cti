[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lupe"]

[project]
name = "lupe-cti"
version = "0.1.0"
description = "Lupe CTI — Cyber Threat Intelligence for OSINT & Forensics"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-whois>=0.9.0",
    "pywebview>=5.0",  # installed: 6.1
    "reportlab>=4.0",
    "phonenumbers>=8.13.0",
    "platformdirs>=4.0",
    "textual>=0.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.6",
    "pre-commit>=3.5",
    "pyyaml>=6.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
lupe = "lupe.cli:app"
lupe-desktop = "lupe.tui.app:run"

[project.urls]
Homepage = "https://github.com/lupe-cti/lupe"
Repository = "https://github.com/lupe-cti/lupe"
Documentation = "https://lupe-cti.readthedocs.io"
Logo = "https://raw.githubusercontent.com/lupe-cti/lupe/main/assets/lupe-logo/lupe-logo.svg"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["lupe"]
omit = ["tests/*", "lupe/desktop/*"]

[tool.coverage.report]
fail_under = 25
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "assets"]
skips = ["B101"]  # assert used in tests

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
