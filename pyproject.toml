[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lupe"]

[project]
name = "lupe-cti"
version = "0.1.0"
description = "Lupe CTI — Cyber Threat Intelligence for OSINT & Forensics"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-whois>=0.9.0",
    "pywebview>=5.0",  # installed: 6.1
    "reportlab>=4.0",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "pytest-cov>=5.0"]

[project.scripts]
lupe = "lupe.cli:app"
lupe-desktop = "lupe.desktop.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["lupe"]
omit = ["tests/*", "lupe/desktop/*"]

[tool.coverage.report]
fail_under = 25
show_missing = true
