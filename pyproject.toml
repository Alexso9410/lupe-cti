[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "centinela"
version = "0.1.0"
description = "IOC Enrichment & Investigation CLI — Heimdall Security"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-whois>=0.9.0",
    "pywebview>=5.0",  # installed: 6.1
    "reportlab>=4.0",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
centinela = "centinela.cli:app"
centinela-desktop = "centinela.desktop.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
