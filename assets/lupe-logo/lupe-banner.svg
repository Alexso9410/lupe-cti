<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lupe CTI — Cyber Threat Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2f3ff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- hex grid texture -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.35">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M150 0 V320 M350 0 V320 M550 0 V320 M750 0 V320 M950 0 V320 M1150 0 V320"/>
  </g>

  <!-- threat-intel node network -->
  <g opacity="0.9">
    <g stroke="#22d3ee" stroke-width="1.4" opacity="0.45">
      <line x1="300" y1="90" x2="190" y2="160"/>
      <line x1="300" y1="90" x2="120" y2="225"/>
      <line x1="190" y1="160" x2="120" y2="225"/>
      <line x1="190" y1="160" x2="305" y2="235"/>
      <line x1="120" y1="225" x2="305" y2="235"/>
      <line x1="305" y1="235" x2="300" y2="90"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="300" cy="90" r="5"/>
      <circle cx="190" cy="160" r="6"/>
      <circle cx="120" cy="225" r="4"/>
      <circle cx="305" cy="235" r="5"/>
    </g>
  </g>

  <!-- magnifying glass (the "lupe") -->
  <g transform="translate(210 160)">
    <circle cx="0" cy="0" r="78" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="56" fill="#0b1220" stroke="url(#lens)" stroke-width="9"/>
    <circle cx="0" cy="0" r="56" fill="#38bdf8" opacity="0.08"/>
    <!-- scan reticle -->
    <g stroke="#7dd3fc" stroke-width="1.4" opacity="0.7">
      <line x1="-56" y1="0" x2="56" y2="0"/>
      <line x1="0" y1="-56" x2="0" y2="56"/>
      <circle cx="0" cy="0" r="26" fill="none"/>
    </g>
    <!-- detected target -->
    <circle cx="14" cy="-10" r="6" fill="#f43f5e"/>
    <circle cx="14" cy="-10" r="11" fill="none" stroke="#f43f5e" stroke-width="1.6" opacity="0.7"/>
    <!-- handle -->
    <rect x="38" y="38" width="74" height="17" rx="8.5" transform="rotate(45 38 38)" fill="url(#lens)"/>
  </g>

  <!-- wordmark -->
  <text x="430" y="155" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="2">LUPE CTI</text>
  <text x="434" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#8aa6c4" letter-spacing="3.5">CYBER THREAT INTELLIGENCE</text>

  <!-- feature chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <g>
      <rect x="434" y="234" width="118" height="34" rx="17" fill="#0e1b2e" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="493" y="256" fill="#7dd3fc" text-anchor="middle">OSINT</text>
    </g>
    <g>
      <rect x="562" y="234" width="138" height="34" rx="17" fill="#0e1b2e" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="631" y="256" fill="#7dd3fc" text-anchor="middle">FORENSICS</text>
    </g>
    <g>
      <rect x="710" y="234" width="196" height="34" rx="17" fill="#0e1b2e" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="808" y="256" fill="#7dd3fc" text-anchor="middle">30+ IOC PLUGINS</text>
    </g>
    <g>
      <rect x="916" y="234" width="150" height="34" rx="17" fill="#0e1b2e" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="991" y="256" fill="#7dd3fc" text-anchor="middle">AI ANALYSIS</text>
    </g>
  </g>

  <!-- right-side data stream -->
  <g font-family="'Courier New', monospace" font-size="13" fill="#1f4d6b" opacity="0.8">
    <text x="1010" y="70">0x4F2A · MALICIOUS</text>
    <text x="1010" y="92">192.168.1.0 · SCAN</text>
    <text x="1010" y="114">sha256:e3b0c442…</text>
    <text x="1010" y="136">domain · FLAGGED</text>
  </g>
  <g fill="#22d3ee" opacity="0.85">
    <circle cx="998" cy="66" r="3"/>
    <circle cx="998" cy="88" r="3"/>
    <circle cx="998" cy="110" r="3" fill="#f43f5e"/>
    <circle cx="998" cy="132" r="3" fill="#f43f5e"/>
  </g>
</svg>
